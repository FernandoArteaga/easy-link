<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}.stage{padding:var(--space-5);display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start}</style>
</head><body>
<div class="stage" style="flex-direction:column;align-items:stretch;max-width:360px">
<div class="el-field"><label for="f1">Email</label><div class="el-field__box"><svg class="el-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg><input id="f1" type="email" placeholder="you@example.com"></div></div>
<div class="el-field el-field--error"><label for="f2">Password</label><div class="el-field__box"><svg class="el-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="f2" type="password" value="12345"><button class="el-iconbtn el-iconbtn--sm" aria-label="Show password"><svg class="el-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="el-field__hint">At least 6 characters.</span></div></div>
<script>/* static preview */</script>
</body></html>
