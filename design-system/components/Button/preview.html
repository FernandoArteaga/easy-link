<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}.stage{padding:var(--space-5);display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start}</style>

<div class="stage" style="flex-direction:column;max-width:360px">
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="el-btn el-btn--primary">Confirm</button><button class="el-btn el-btn--save"><svg class="el-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Save link</button><button class="el-btn el-btn--tonal"><svg class="el-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>New folder</button></div>

<button class="el-btn el-btn--primary el-btn--block">Sign in</button></div>
