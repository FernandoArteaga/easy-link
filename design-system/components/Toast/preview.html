<!-- @dsCard group="Feedback" height=150 -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}.stage{padding:var(--space-5);display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start}</style>
</head><body>
<div class="stage" style="flex-direction:column;align-items:center;max-width:390px">
<div class="el-toast" role="status"><span class="el-toast__dot"><svg class="el-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span>Link copied</span></div>
<div class="el-toast" role="status"><span class="el-toast__dot"><svg class="el-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></span>Link deleted<button class="el-toast__action">Undo</button></div>
<div class="el-toast el-toast--error" role="alert"><span class="el-toast__dot"><svg class="el-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span><span>Couldn't save. Check your connection.</span></div></div>
<script>/* static preview */</script>
</body></html>
