<!doctype html>
<html lang="en">
	<head>
		<title>The Easy Link</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Effortlessly save and access your copied links across all your devices."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/ios.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
		/>
		<link rel="canonical" href="https://the-easy-link.web.app/" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-ink min-h-svh font-sans antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
